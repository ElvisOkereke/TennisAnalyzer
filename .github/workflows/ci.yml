name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: ruff check python/
      - run: pytest python/

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -p && xcodebuild -version
      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project ios-app/TennisAnalyzer/TennisAnalyzer.xcodeproj \
            -scheme TennisAnalyzer \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
